[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygrid-robot"
version = "0.1.0"
description = "CPU-first TinyGrid fire/person/furniture detector with bundled ONNX weights"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.3", "opencv-python==4.14.0.94"]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu[cuda,cudnn]==1.23.2"]

[tool.setuptools]
packages = ["lightdet", "lightdet.models"]

[tool.setuptools.package-data]
lightdet = ["models/*.onnx", "models/*.json"]
